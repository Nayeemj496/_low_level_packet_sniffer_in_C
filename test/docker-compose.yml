services:
    ubuntu:
        build:
            context: .
            dockerfile: Dockerfile
            network: host
        container_name: ubuntu_
        command: tail -f /dev/null
        cap_add:
            - SYS_ADMIN
            - NET_ADMIN
        networks:
            - docker_net
    flask:
        build:
            context: web_server
            dockerfile: Dockerfile
            network: host
        container_name: web_server_
        networks:
            - docker_net
networks:
    docker_net:
        driver: bridge
        name: docker_net_
